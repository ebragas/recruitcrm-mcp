[project]
name = "recruit-crm-mcp"
version = "0.19.0"
description = "MCP server for Recruit CRM"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "fastmcp>=2.0.0",
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
    "sentry-sdk[mcp]>=2.43.0",
    "markdown-it-py>=3.0.0",
    "markdownify>=0.11.0",
    # Used directly in formatting.py for pre-conversion subtree pruning.
    # markdownify ships bs4 transitively today, but declare it explicitly
    # so we don't break if that dep set ever changes.
    "beautifulsoup4>=4.12.0",
    # BaseExceptionGroup is builtin on 3.11+; backport on 3.10. Used by
    # telemetry._before_send to filter benign stdio-shutdown EPIPE wrapped
    # by anyio's task group. Currently transitive via anyio — declared
    # explicitly so the filter doesn't break if anyio drops the marker.
    "exceptiongroup>=1.1.0; python_version < '3.11'",
]

[project.urls]
Homepage = "https://github.com/ebragas/recruitcrm-mcp"
Repository = "https://github.com/ebragas/recruitcrm-mcp"
Issues = "https://github.com/ebragas/recruitcrm-mcp/issues"

[project.scripts]
recruit-crm-mcp = "recruit_crm_mcp.server:main"
recruit-crm-mcp-install = "recruit_crm_mcp.install:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/recruit_crm_mcp"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=6.0",
    "pytest-dotenv>=0.5.2",
    "anyio>=4.0",
    "pytest-anyio>=0.0.0",
    "ruff>=0.9.0",
]

[tool.ruff]
src = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: tests that hit the live Recruit CRM API",
    "mcp: tests that exercise the FastMCP in-process dispatch layer",
    "mcp_live: mcp-layer tests that additionally hit the live Recruit CRM API",
]

[tool.semantic_release]
version_toml = ["pyproject.toml:project.version"]
branch = "main"
commit_message = "chore(release): {version}"
changelog_file = "CHANGELOG.md"
upload_to_vcs_release = true
build_command = "uv lock"
